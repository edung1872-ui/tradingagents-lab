name: TradingAgents AI research (read only)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tradingagents-research.yml'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TRADINGAGENTS_LLM_PROVIDER: openai
      TRADINGAGENTS_QUICK_THINK_LLM: gpt-4o-mini
      TRADINGAGENTS_DEEP_THINK_LLM: gpt-4o-mini
      TRADINGAGENTS_MAX_DEBATE_ROUNDS: '1'
      TRADINGAGENTS_MAX_RISK_ROUNDS: '1'
      TRADINGAGENTS_OUTPUT_LANGUAGE: English
      TRADINGAGENTS_NO_UPDATE_CHECK: '1'
    steps:
      - name: Check model credentials
        id: creds
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No OPENAI_API_KEY repository secret. AI inference was not run." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Checkout original TradingAgents
        if: steps.creds.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          repository: TauricResearch/TradingAgents
          ref: main
          path: upstream
          persist-credentials: false
      - name: Install Python 3.13
        if: steps.creds.outputs.available == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install TradingAgents
        if: steps.creds.outputs.available == 'true'
        working-directory: upstream
        run: python -m pip install .
      - name: Run historical research on AAPL
        if: steps.creds.outputs.available == 'true'
        working-directory: upstream
        run: |
          tradingagents --ticker AAPL --date 2026-10-20 --analysts market,news --save --no-show
      - name: Upload research reports
        if: always() && steps.creds.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tradingagents-research
          path: |
            upstream/results/
            upstream/tradingagents_data/
          if-no-files-found: warn
          retention-days: 7

# Rerun after API credential configured — 2026-10-28
