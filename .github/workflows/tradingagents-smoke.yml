name: TradingAgents dependency and smoke test (no trading)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tradingagents-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout upstream TradingAgents
        uses: actions/checkout@v4
        with:
          repository: TauricResearch/TradingAgents
          ref: main
          path: tradingagents-src
          persist-credentials: false
      - name: Install Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tradingagents-src/pyproject.toml
      - name: Install source package
        working-directory: tradingagents-src
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Verify installed package and CLI
        run: |
          python -c "import tradingagents; print('TradingAgents imported:', tradingagents.__file__)"
          tradingagents --help
      - name: Run upstream unit tests
        working-directory: tradingagents-src
        run: |
          python -m pip install pytest pytest-subtests
          python -m pytest -m 'not integration' -q
      - name: Write outcome summary
        if: always()
        run: |
          echo 'Installation and non-integration tests only. No model inference, paper orders or live orders.' >> "$GITHUB_STEP_SUMMARY"
